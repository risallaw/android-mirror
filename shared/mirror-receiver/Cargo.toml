[package]
name = "mirror-receiver"
version.workspace = true
edition.workspace = true
license.workspace = true

# UI stack pinned together: egui 0.37 requires winit 0.30.13+ and wgpu 30.
[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }  # 0.37 has default = []
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "accesskit"] }
egui-wgpu = "0.37"
winit = "0.30.13"
wgpu = "30"
pollster = "0.4"

# Network client (M2): std threads + blocking sockets, no async runtime.
mirror-protocol = { workspace = true }
crossbeam-channel = "0.5"
socket2 = "0.6"
getrandom = "0.4"

# M3: remembered address/client id (small JSON in the user's app data dir).
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phone-supplied strings (grapheme-aware truncation, Cf filtering) and the
# typed PIN (wiped on drop). Both are already in the tree via egui / protocol.
unicode-segmentation = "1"
unicode-general-category = "1"
zeroize = "1.8"
