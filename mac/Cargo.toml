[package]
name = "mirror-mac"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "AndroidMirror"
path = "src/main.rs"

[dependencies]
mirror-receiver = { workspace = true }
mirror-protocol = { workspace = true }
winit = "0.30.13"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSWindow", "NSScreen", "NSView", "NSResponder", "NSGraphics", "NSPasteboard", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSAccessibility", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "VTBase", "VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }
raw-window-handle = "0.6"
libc = "0.2"
