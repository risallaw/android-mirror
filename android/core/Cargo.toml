[package]
name = "mirror-android-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mirror_core"
crate-type = ["cdylib", "rlib"]

# Host-testable logic (config, encoder format ladder, geometry) builds everywhere;
# JNI and NDK code is cfg-gated to Android.
[dependencies]
mirror-protocol = { workspace = true }
mirror-sender = { workspace = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["media", "nativewindow", "api-level-29"] }
ndk-sys = "0.6"
zeroize = "1.8"
